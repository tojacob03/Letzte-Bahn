[project]
name = "transit-atlas"
version = "0.1.0"
description = "Public transport accessibility atlas: travel times to everyday destinations and reachable population per grid cell and municipality."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.9.4,<1.11",
    "duckdb>=1.4,<1.5",
    "geopandas>=1.0",
    "numpy>=2.0",
    "osmium>=4.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    # routing.py drives r5py's RegionalTask and R5's TravelTimeComputer directly
    # (to route origins in parallel), so the version is pinned.
    "r5py==1.1.7",
    "requests>=2.32",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
atlas = "transit_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["dbt: builds the dbt project on synthetic fixture data"]
